<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumina Stage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: sidebar com os dias de prova + palco central com missões. Visual de estúdio de K-pop, tema escuro único. */
:root{
  color-scheme:dark;
  --bg:#0d0a20; --bg2:#151032; --panel:#1b1540; --panel2:#251d55; --line:#3b3080;
  --ink:#f7f3ff; --muted:#b9b0e6;
  --pink:#ff4fa3; --cyan:#35e6ff; --lime:#c6f432; --violet:#9b7bff; --gold:#ffd04a;
  --good:#38e08c; --bad:#ff6b7a;
  --fd:'Unbounded',system-ui,sans-serif; --fb:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 88% -8%,rgba(255,79,163,.26),transparent 60%),radial-gradient(760px 520px at -8% 18%,rgba(53,230,255,.15),transparent 60%);
  background-attachment:fixed;
  color:var(--ink);font:400 18px/1.55 var(--fb);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--fd);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.55rem,3.6vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:10px}
.mono{font-family:ui-monospace,Consolas,monospace;white-space:pre}

.app{display:grid;grid-template-columns:304px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto}
.top{display:none}
.side{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:22px 0 22px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.wm{font-family:var(--fd);font-weight:800;font-size:1.35rem;letter-spacing:.04em;background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:.8rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.me b{font-family:var(--fd);font-size:.95rem}
.nav{display:flex;flex-direction:column;gap:8px}
.navl{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 2px 0}
.day{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;border-radius:16px;padding:10px 12px;width:100%;text-decoration:none;color:inherit}
.day:hover{background:var(--panel)}
.day.on{background:var(--panel2);border-color:var(--pink)}
.dt{font-family:var(--fd);font-size:.8rem;font-weight:700;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;line-height:1.25}
.dt small{display:block;font-family:var(--fb);font-weight:600;color:var(--muted);font-size:.7rem}
.dn{font-weight:800;line-height:1.25}
.dp{font-size:.82rem;color:var(--muted)}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.tag.rec{background:var(--lime);color:#1d2200}
.tag.soon{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.lnk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;text-decoration:none;color:inherit;border:1px solid transparent}
.lnk:hover{background:var(--panel)}
.lnk.on{background:var(--panel2);border-color:var(--cyan)}
.snd{margin-top:auto;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.snd button{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:800}

.main{padding:26px 0 90px;min-width:0}
.kick{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:8px}
.lead{color:var(--muted);max-width:62ch}
.hero{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chp{font-size:.82rem;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 24px;font-weight:800;font-size:1.02rem;color:#fff;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 8px 28px rgba(255,79,163,.35);text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.cy{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#0d0a20;box-shadow:0 8px 28px rgba(53,230,255,.25)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:800;color:var(--ink);text-decoration:none;display:inline-flex}
.ghost:hover{background:var(--panel)}
.sm{padding:6px 12px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mc{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;position:relative;min-width:0}
.mc:hover{border-color:var(--pink);transform:translateY(-2px)}
.mc{transition:transform .15s,border-color .15s}
.mc h3{font-size:1rem}
.mc .meta{color:var(--muted);font-size:.85rem}
.mc.boss{background:linear-gradient(160deg,#3a1465,#5b1650);border-color:var(--pink)}
.mc .done{position:absolute;top:14px;right:14px}
.alt{display:none;color:var(--cyan);font-size:.92em;margin-top:4px}
body.alt-on .alt{display:block}
.mc .alt{font-size:.8rem}

.stars{display:inline-flex;gap:2px}
.stars svg{width:20px;height:20px}
.av{flex:none}

/* exercício */
.xc{max-width:780px;display:flex;flex-direction:column;gap:18px}
.xtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pbar{flex:1;min-width:120px;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));border-radius:99px;transition:width .3s}
.cnt{font-weight:800;color:var(--muted);font-size:.9rem}
.guide{display:flex;align-items:center;gap:12px}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 14px;font-size:.95rem;color:var(--muted)}
.q{font-size:1.25rem;font-weight:800;line-height:1.4}
.q b{color:var(--gold)}
.vis{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}
.vis.txt{display:block;font-weight:600;line-height:1.65}
.bigcoin{padding:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:800;font-size:1.05rem;text-align:left;min-height:58px;display:flex;flex-direction:column;justify-content:center}
.opt:hover:not(:disabled){border-color:var(--cyan);background:var(--panel2)}
.opt:disabled{cursor:default}
.opt.ok,.tk.ok,.chip.ok{border-color:var(--good);background:rgba(56,224,140,.18)}
.opt.no,.tk.no,.chip.no{border-color:var(--bad);background:rgba(255,107,122,.2)}
.tks{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tk{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:800;font-size:1.15rem;min-height:48px}
.tk.big{font-family:var(--fd);font-size:1.5rem;padding:14px 20px}
.tk.shp{padding:8px}
.tk:hover:not(:disabled){border-color:var(--cyan)}
.tk.sel{border-color:var(--gold);background:rgba(255,208,74,.18)}
.tk.miss{border-color:var(--gold);border-style:dashed}
.sep{color:var(--muted);font-family:var(--fd);font-size:1.4rem}
.q2{font-weight:800;margin:16px 0 10px}
.hint{color:var(--gold);font-weight:700;margin-top:8px}
.pool,.bk-body{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:52px}
.pool{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:12px}
.chip{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;cursor:grab}
.chip.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,208,74,.3)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.bk{border:2px dashed var(--violet);border-radius:18px;padding:12px;background:rgba(155,123,255,.07);cursor:pointer;min-height:130px}
.bk.over{background:rgba(155,123,255,.25)}
.bk h4{margin:0 0 8px;font-family:var(--fd);font-size:.85rem}
.bk h4 small{display:block;font-family:var(--fb);color:var(--muted);font-weight:600;font-size:.78rem;margin-top:2px}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.fb{border-radius:18px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.fbh{font-family:var(--fd);font-weight:700}
.fbh.g{color:var(--good)} .fbh.b{color:var(--gold)}
.fbt{font-size:1rem}
.fbt .fr{font-size:1rem}
.sl{fill:rgba(255,255,255,.07);stroke:#fff;stroke-width:2}
.sl.on{fill:var(--c,var(--pink))}
.click .sl{cursor:pointer}
.click .sl:hover{fill:rgba(255,255,255,.22)}
.click .sl.on:hover{fill:var(--c,var(--pink))}
.dot.on{fill:var(--cyan)}
.piegrp{display:flex;gap:10px;flex-wrap:wrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:800;margin:0 .18em}
.fr i{font-style:normal;padding:0 .35em}
.fr i:first-child{border-bottom:2px solid currentColor}
.sh{fill:rgba(255,255,255,.1);stroke:#fff;stroke-width:2.5}
.ln{stroke:var(--pink);stroke-width:3.5;stroke-linecap:round}
.cnt-tot{font-family:var(--fd);font-size:1.6rem;color:var(--gold)}
.heap{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.tray{min-height:104px;border:2px dashed var(--cyan);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:rgba(53,230,255,.06)}
.tray.over{background:rgba(53,230,255,.2)}
.tray .coin{cursor:pointer}
.trayhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;gap:10px;flex-wrap:wrap}
.pal{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.coin{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px;cursor:grab;display:flex;flex-direction:column;align-items:center;gap:2px}
.coin:hover{border-color:var(--cyan)}
.coin small{font-size:.72rem;color:var(--muted);font-weight:700}
.tray .coin{background:transparent;border-color:transparent;padding:2px}
.price{display:inline-flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--gold);border-radius:14px;padding:8px 16px;font-family:var(--fd);font-weight:700;color:var(--gold);font-size:1.25rem}
.price span{font-family:var(--fb);color:var(--ink);font-size:1rem;font-weight:800}

/* lição */
.lesson{max-width:780px;display:flex;flex-direction:column;gap:16px}
.lesson .card p{margin:0 0 .6em}
.lesson ul{margin:.3em 0 .6em;padding-left:1.2em}
.lesson li{margin:.25em 0}
.lesson b{color:var(--gold)}
.tripl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.tripl div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:.9rem}
.tripl big{display:block;font-family:var(--fd);font-size:1.25rem;margin:4px 0}
.coinrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0}
.coinrow div{display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:.85rem;text-align:center}
.coinrow small{color:var(--muted);font-weight:600}

/* resumo */
.sum{max-width:780px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.big{font-family:var(--fd);font-size:2.2rem;font-weight:800}
.rep{width:100%;min-height:190px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;font:600 .9rem/1.5 ui-monospace,Consolas,monospace}

/* cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pc{aspect-ratio:3/4;border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 60%,#0d0a20),#150f35 75%);border:2px solid var(--c)}
.pc b{font-family:var(--fd);font-size:.9rem}
.pc small{font-size:.74rem;color:#e8e0ff;line-height:1.2}
.pc.lock{filter:grayscale(1) brightness(.6);border-style:dashed}
.pc .pcav{display:grid;place-items:center;min-height:90px;font-family:var(--fd);font-size:2rem}
.pc.holo{border-color:transparent;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 60%,#0d0a20),#150f35 75%) padding-box,linear-gradient(135deg,var(--pink),var(--cyan),var(--gold),var(--pink)) border-box;border:3px solid transparent}

table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.tw{overflow-x:auto}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:800}

/* dance */
.dance{position:fixed;inset:0;z-index:60;background:radial-gradient(800px 500px at 50% 0,rgba(255,79,163,.45),transparent 60%),#0d0a20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.dance h2{font-size:clamp(1.4rem,4vw,2.2rem)}
.dcr{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.dcr .av{animation:bop .5s ease-in-out infinite alternate}
.dcr .av:nth-child(2){animation-delay:.1s}.dcr .av:nth-child(3){animation-delay:.2s}.dcr .av:nth-child(4){animation-delay:.3s}.dcr .av:nth-child(5){animation-delay:.4s}
@keyframes bop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-26px) rotate(6deg)}}
.eq{display:flex;gap:6px;align-items:flex-end;height:60px}
.eq i{width:10px;border-radius:4px;background:linear-gradient(var(--cyan),var(--pink));animation:eq .6s ease-in-out infinite alternate}
@keyframes eq{from{height:8px}to{height:58px}}
.eq i:nth-child(2n){animation-duration:.45s}.eq i:nth-child(3n){animation-duration:.8s}.eq i:nth-child(5n){animation-delay:.2s}
.dtime{font-family:var(--fd);font-size:2.4rem;color:var(--gold)}
@media (prefers-reduced-motion:reduce){.dcr .av,.eq i,.mc{animation:none;transition:none}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .top{display:flex;align-items:center;gap:12px;padding:14px 0 4px}
  .top button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800}
  .side{position:fixed;left:0;top:0;bottom:0;max-height:none;width:min(88vw,340px);background:var(--bg2);z-index:40;padding:20px 16px 20px max(16px,env(safe-area-inset-left,0px));transform:translateX(-108%);transition:transform .25s;border-right:1px solid var(--line)}
  .side.open{transform:none}
  .main{padding-top:14px}
  body{font-size:17px}
}

/* iPad / toque */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.chip,.coin,.tk,.opt,.btn,.ghost,.bk,.mc,.day{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip,.pal .coin{touch-action:none}
.chip{min-height:46px;display:inline-flex;align-items:center}
.tdrag{position:fixed;z-index:200;pointer-events:none;opacity:.92;transform:translate(-50%,-60%) scale(1.08);box-shadow:0 10px 28px rgba(0,0,0,.5)}
.bk.over,.tray.over,.pool.over{outline:3px solid var(--cyan);outline-offset:2px}
@media (pointer:coarse){.opt{min-height:66px}.tk{min-height:56px}.btn{min-height:52px}.ghost{min-height:44px}.chip{min-height:50px;font-size:1.08rem}.pal .coin{padding:8px}}
@media (min-width:700px) and (max-width:1200px){html{font-size:17px}.side{max-height:100dvh}}
@supports (height:100dvh){.side{max-height:100dvh}}
</style>

<div class="top"><button id="menu" aria-label="Abrir menu de dias">Menu</button><span class="wm">LUMINA</span></div>
<div class="app">
  <aside class="side" id="side" aria-label="Menu de provas">
    <a class="brand" href="#"><div><div class="wm">LUMINA</div><div class="sub">Study Stage</div></div></a>
    <div class="me" id="me"></div>
    <nav class="nav" id="days" aria-label="Dias de prova"></nav>
    <nav class="nav">
      <div class="navl">Mais</div>
      <a class="lnk" id="l-album" href="#album">Álbum de photocards</a>
      <a class="lnk" id="l-pais" href="#pais">Área dos pais</a>
    </nav>
    <div class="snd"><span>Som</span><button id="snd" aria-pressed="true">Ligado</button></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="over"></div>

<script>
(function(){'use strict';
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[rnd(0,a.length-1)];
const sample=(a,n)=>shuffle(a).slice(0,n);
const strip=w=>w.replace(/[.,;:!?"()]/g,'').toLowerCase();
const gcd=(a,b)=>b?gcd(b,a%b):a;
const B=(en,pt)=>({en,pt});
const T=(o,l)=>typeof o==='string'?o:((o&&(o[l]||o.pt||o.en))||'');
let LANG='pt';
const txt=o=>{if(typeof o==='string')return o;const p=T(o,LANG);return(LANG==='en'&&o.pt)?p+'<span class="alt">'+o.pt+'</span>':p};
const ptx=o=>typeof o==='string'?o:T(o,'pt');
function plain(html){const d=document.createElement('div');d.innerHTML=html;$$('.fr',d).forEach(e=>{const i=$$('i',e);e.replaceWith(i[0].textContent+'/'+i[1].textContent)});return d.textContent.replace(/\s+/g,' ').trim()}
const $f=c=>'$'+(c/100).toFixed(2);
const vt=c=>c<100?c+'¢':'$'+(c/100);
const fr=(n,d)=>'<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>';
const mixed=(w,n,d)=>w+' '+fr(n,d);

/* ---------- progresso salvo ---------- */
const KEY='lumina-olivia-v1';
let S={stars:{},log:[],sound:true,alt:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- som ---------- */
let AC=null;

const APTXT='<p><b>O Lápis e a Borracha</b></p><p>Na mesa de estudos, o Lápis vivia se gabando: — Eu escrevo todas as histórias do mundo! Sem mim, ninguém aprenderia nada.</p><p>A Borracha, quietinha, ouvia tudo. Um dia, o Lápis escreveu uma palavra errada e ficou nervoso: — Socorro! Quem me ajuda a consertar isso?</p><p>A Borracha apagou o erro com cuidado e disse: — Eu não escrevo histórias, mas ajudo a deixá-las melhores.</p><p>O Lápis ficou envergonhado e aprendeu que todos têm o seu valor.</p>';
function apoText(){return [
 choiceEx({label:'Personagens do texto',q:'Quem são os personagens da história <b>O Lápis e a Borracha</b>?',vis:APTXT,visTxt:1,opts:[opt('O Lápis e a Borracha',1),opt('Um menino e uma menina'),opt('O Lápis e o Caderno'),opt('A Borracha e a Régua')],ex:'Os personagens são o Lápis e a Borracha: objetos que falam. Isso é típico do apólogo.'}),
 choiceEx({label:'Defeito do Lápis',q:'Qual defeito o Lápis mostrou no começo?',vis:APTXT,visTxt:1,opts:[opt('Orgulho: ele se achava o mais importante',1),opt('Medo do escuro'),opt('Preguiça'),opt('Generosidade')],ex:'O Lápis se gabava e achava que não precisava de ninguém. É orgulho, um comportamento humano criticado no apólogo.'}),
 choiceEx({label:'Como a Borracha ajudou',q:'Como a Borracha ajudou o Lápis?',vis:APTXT,visTxt:1,opts:[opt('Apagou o erro com cuidado',1),opt('Escreveu outra história'),opt('Quebrou o Lápis'),opt('Foi embora')],ex:'O texto diz que a Borracha apagou o erro com cuidado.'}),
 choiceEx({label:'Moral do apólogo',q:'Qual é o <b>ensinamento moral</b> dessa história?',vis:APTXT,visTxt:1,opts:[opt('Todos têm valor e um ajuda o outro',1),opt('Quem escreve é melhor que quem apaga'),opt('Nunca cometa erros'),opt('Fale sempre bem alto')],ex:'A última frase mostra a moral: todos têm o seu valor.'}),
 choiceEx({label:'Por que é apólogo',q:'Por que essa história é um <b>apólogo</b>?',vis:APTXT,visTxt:1,opts:[opt('Objetos ganham voz e ela termina com uma lição',1),opt('Tem reis e dragões'),opt('É uma receita de bolo'),opt('É uma notícia de jornal')],ex:'Apólogo = narrativa curta, personagens inanimados que falam, diálogo, tom alegórico e final com ensinamento moral.'})]}
function apoKnow(){return [
 choiceEx({label:'Personagens do apólogo',q:'Quem costuma ser personagem de um apólogo?',opts:[opt('Objetos, plantas ou partes do corpo que falam',1),opt('Apenas reis e rainhas'),opt('Somente animais de fazenda'),opt('Super-heróis')],ex:'No apólogo, os personagens são inanimados: objetos, plantas ou partes do corpo que ganham vida e voz (uma agulha e uma linha, um relógio e um espelho).'}),
 choiceEx({label:'Final do apólogo',q:'Como um apólogo termina?',opts:[opt('Com um ensinamento moral',1),opt('Com uma receita'),opt('Com uma lista de compras'),opt('Sem nenhum final')],ex:'O final traz uma reflexão ética ou social, de um jeito mais sutil que a fábula.'}),
 choiceEx({label:'Tamanho do apólogo',q:'O apólogo é um gênero narrativo…',opts:[opt('curto',1),opt('longo como um romance'),opt('só em versos'),opt('só em desenhos')],ex:'É uma história breve, como a fábula.'}),
 choiceEx({label:'Narrador do apólogo',q:'Quem normalmente conta a história de um apólogo?',opts:[opt('Um observador (narrador em 3ª pessoa)',1),opt('O próprio Lápis (1ª pessoa)'),opt('O leitor'),opt('Ninguém conta')],ex:'Em geral o narrador é um observador, que conta tudo em terceira pessoa.'}),
 choiceEx({label:'Crítica do apólogo',q:'O apólogo faz o leitor pensar sobre…',opts:[opt('virtudes e defeitos das pessoas, como orgulho e humildade',1),opt('preços de supermercado'),opt('a previsão do tempo'),opt('regras de jogos')],ex:'O apólogo critica o comportamento humano: orgulho, vaidade, inveja, humildade…'}),
 choiceEx({label:'Tom alegórico',q:'No apólogo, os objetos representam…',opts:[opt('valores, sentimentos ou comportamentos humanos',1),opt('só objetos de verdade'),opt('números'),opt('lugares do mapa')],ex:'Esse é o tom alegórico: o objeto "fala" por uma ideia humana.'})]}
function conto(){return [
 choiceEx({label:'Conto de Escola: personagem',q:'No "Conto de Escola", de <b>Machado de Assis</b>, quem é o menino da história?',opts:[opt('Pilar',1),opt('Dom Casmurro'),opt('Brás Cubas'),opt('Quincas')],ex:'O menino é o Pilar. Ele se envolve numa confusão numa sala de aula do século XIX.'}),
 choiceEx({label:'Conto de Escola: final',q:'Como termina a confusão em que o Pilar se envolve?',opts:[opt('Com uma punição',1),opt('Com um prêmio'),opt('Com uma festa'),opt('Com uma viagem')],ex:'Na história, a confusão termina com uma punição.'}),
 choiceEx({label:'Escola tradicional',q:'Na escola tradicional, quem era o centro da aprendizagem?',opts:[opt('O professor',1),opt('O aluno'),opt('O colega'),opt('A família')],ex:'O professor era o centro e transmitia o conhecimento. As aulas eram em fileiras, com todos olhando para o quadro.'})]}

const PM=[
 {id:'p1',guide:'mira',mins:7,title:'Sílaba tônica: ache a mais forte',lesson:'<div class="card"><p>A <b>sílaba tônica</b> é a pronunciada com mais força. Toda palavra tem só uma.</p><p>Para classificar, <b>conte de trás pra frente</b>:</p><div class="tripl"><div>3ª de trás<big>má</big>antepenúltima</div><div>2ª de trás<big>gi</big>penúltima</div><div>1ª de trás<big>ca</big>última</div></div></div><div class="card"><div class="tripl"><div><b>Oxítona</b><br>tônica = última<big>me-TRÔ</big>su-FLÊ, su-POR</div><div><b>Paroxítona</b><br>tônica = penúltima<big>ca-RÁ-ter</big>ca-va-LEI-ro</div><div><b>Proparoxítona</b><br>tônica = antepenúltima<big>MÁ-gi-ca</big>LÂM-pa-da</div></div><p><b>Macete:</b> toda proparoxítona leva acento. Se a palavra tem acento na antepenúltima, é proparoxítona.</p></div>',build:()=>sample(W.map(w=>w[0]),8).map(sylEx)},

 {id:'p3',guide:'sol',mins:7,title:'Verbos e tempos verbais',lesson:'<div class="card"><p><b>Verbo</b> é a palavra que mostra ação, estado, desejo ou fenômeno da natureza: andar, estudar, comer, chover.</p><div class="tripl"><div>Pretérito<big>fizeram</big>já passou</div><div>Presente<big>tomo</big>agora / costume</div><div>Futuro<big>dormirei</big>vai acontecer</div></div><p>Dicas: <b>ontem</b> pede passado, <b>amanhã</b> pede futuro. Terminações como <b>-rei, -rá, -rão</b> costumam indicar futuro (ficarei, ventará, estarão).</p></div>',build:()=>sample(VB,10).map(verbEx).concat([choiceEx({label:'Frase no futuro',q:'Qual frase está no <b>futuro</b>?',opts:[opt('Eu estudarei amanhã.',1),opt('Eu estudei ontem.'),opt('Eu estudo agora.'),opt('Eu estudava sempre.')],ex:'<b>estudarei</b> termina em -rei e fala de algo que ainda vai acontecer.'}),choiceEx({label:'Para que servem os verbos',q:'Os verbos servem para indicar…',opts:[opt('ação, estado, desejo ou fenômeno da natureza',1),opt('só nomes de pessoas'),opt('só qualidades'),opt('só lugares')],ex:'Verbos mostram o que acontece: uma ação, um estado, um desejo ou um fenômeno da natureza.'})])},
 {id:'p4',guide:'kai',mins:6,title:'Adjetivos',lesson:'<div class="card"><p><b>Adjetivo</b> é a palavra que diz como o substantivo é: qualidade, defeito, estado, condição.</p><p>Exemplos: <b>lindo, feio, amarrotado, grande</b>.</p><p>Ele muda de gênero e número junto com o substantivo: menino <b>alegre</b>, meninas <b>alegres</b>.</p></div>',build:()=>sample(AJ,6).map(adjEx).concat([
  choiceEx({label:'Palavra adjetivo',q:'Qual palavra é um adjetivo em <b>uma casa enorme</b>?',opts:[opt('enorme',1),opt('casa'),opt('uma'),opt('em')],ex:'<b>enorme</b> diz como a casa é.'}),
  choiceEx({label:'O que o adjetivo faz',q:'O que o adjetivo faz?',opts:[opt('Diz como o substantivo é',1),opt('Indica uma ação'),opt('Liga duas palavras'),opt('Mostra quando algo acontece')],ex:'O adjetivo caracteriza o substantivo: qualidade, defeito, estado ou condição.'}),
  choiceEx({label:'Só adjetivos',q:'Qual grupo tem <b>só adjetivos</b>?',opts:[opt('lindo, feio, grande',1),opt('correr, pular, nadar'),opt('mesa, cadeira, livro'),opt('ontem, hoje, amanhã')],ex:'lindo, feio e grande dizem como algo é. Correr, pular e nadar são verbos; mesa, cadeira e livro são substantivos.'}),
  choiceEx({label:'Concordância',q:'Qual está certo?',opts:[opt('meninas alegres',1),opt('meninas alegre'),opt('menina alegres'),opt('meninos alegre')],ex:'O adjetivo concorda com o substantivo: meninas (plural) pede alegres (plural).'})])},
 {id:'p5',guide:'juno',mins:6,title:'Sons do X',lesson:'<div class="card"><p>A letra <b>X</b> pode ter 4 sons:</p><ul><li>som de <b>CH</b>: xícara, enxada, peixe, abacaxi</li><li>som de <b>Z</b>: exagero, exemplo, exato, exame</li><li>som de <b>KS</b>: táxi, reflexão, tóxico, látex</li><li>som de <b>S</b>: próximo, auxílio, texto, expansão</li></ul><p><b>Macete:</b> <b>ex + vogal</b> no começo (exame, exato) faz Z. <b>ex + consoante</b> (expansão, expectativa) faz S.</p></div>',build:()=>[sortX(),sortX(),xChoice(),xChoice(),xChoice()].concat(sample(SPELL,3).map(spellEx))},
 {id:'p6',guide:'mira',mins:8,title:'Apólogo e interpretação de texto',lesson:'<div class="card"><p><b>Apólogo</b> é uma narrativa curta em que <b>objetos, plantas ou partes do corpo</b> ganham vida e voz.</p><ul><li>Gênero narrativo curto (como a fábula)</li><li>Personagens inanimados</li><li>Tem diálogo</li><li>Tom alegórico: o objeto representa um valor ou comportamento humano</li><li>Final com <b>ensinamento moral</b>, de forma sutil</li><li>Narrador em 3ª pessoa, linguagem simples</li></ul></div><div class="card"><p>Também revisamos o <b>Conto de Escola</b>, de Machado de Assis: o menino Pilar se envolve numa confusão e termina punido. Isso nos fez comparar a escola tradicional (professor no centro, salas em fileiras) com a de hoje.</p></div>',build:()=>apoText().concat(sample(apoKnow(),4),sample(conto(),2))}

const COINNAMES=['Penny','Nickel','Dime','Quarter','Loonie','Toonie'];
const COINID={Penny:'penny',Nickel:'nickel',Dime:'dime',Quarter:'quarter',Loonie:'loonie',Toonie:'toonie'};
const TIP={
 penny:B('The penny is copper-colored and worth 1¢.','O penny é cor de cobre e vale 1¢.'),
 nickel:B('The nickel is bigger than the dime, but worth less (5¢).','O nickel é maior que o dime, mas vale menos (5¢).'),
 dime:B('The dime is the smallest coin, but it is worth 10¢.','O dime é a menor moeda, mas vale 10¢.'),
 quarter:B('The quarter is the biggest silver coin: 25¢.','O quarter é a maior moeda prateada: 25¢.'),
 loonie:B('The loonie is gold-colored with 11 sides: $1.','O loonie é dourado e tem 11 lados: $1.'),
 toonie:B('The toonie has two colors, silver outside and gold inside: $2.','O toonie tem duas cores, prata fora e dourado dentro: $2.')
};
function gCoinId(id){const c=CI[id];const wr=shuffle(COINNAMES.filter(n=>n!==c.name));
 return choiceEx({label:'Nome da moeda de '+c.lbl,q:B('What is the name of this coin?','Qual é o nome desta moeda?'),vis:'<div class="bigcoin">'+coin(id,1.7)+'</div>',opts:[opt(c.name,1)].concat(wr.slice(0,3).map(n=>opt(n))),ex:B('It is a <b>'+c.name+'</b>, worth <b>'+c.lbl+'</b>. ','É um <b>'+c.name+'</b>, vale <b>'+c.lbl+'</b>. ')});}
function gCoinId2(id){const c=CI[id];const t=TIP[id];const o=gCoinId(id);o.ex={en:o.ex.en+t.en,pt:o.ex.pt+t.pt};return o}
function gValName(){const id=pick(['penny','nickel','dime','quarter','loonie','toonie']);const c=CI[id];const wr=shuffle(COINNAMES.filter(n=>n!==c.name)).slice(0,3);
 return choiceEx({label:'Qual moeda vale '+c.lbl,q:B('Which coin is worth <b>'+c.lbl+'</b>?','Qual moeda vale <b>'+c.lbl+'</b>?'),opts:[opt(c.name,1)].concat(wr.map(n=>opt(n))),ex:B('The <b>'+c.name+'</b> is worth '+c.lbl+'. ','O <b>'+c.name+'</b> vale '+c.lbl+'. ')})}
function runningText(ids){const so=ids.slice().sort((a,b)=>CI[b].c-CI[a].c);let r=0;return so.map(id=>{r+=CI[id].c;return vt(CI[id].c)+' → '+$f(r)}).join(', ')}
function gCount(){let items=[];[['toonie',2],['loonie',2],['quarter',3],['dime',3],['nickel',2],['penny',3]].forEach(p=>{const n=rnd(0,p[1]);for(let i=0;i<n;i++)items.push(p[0])});
 if(Math.random()<.5)items.push(pick(['b5','b10']));
 if(items.length<3)items.push('quarter','dime','nickel');
 if(items.length>10)items=items.slice(0,10);
 items=shuffle(items);const tot=items.reduce((a,id)=>a+CI[id].c,0);
 const wr=shuffle([tot+5,tot-5,tot+10,tot-10,tot+25,tot-25,tot+100,tot-100,tot+1]).filter(x=>x>0);
 return choiceEx({label:'Contar o dinheiro (total '+$f(tot)+')',q:B('Count the money. How much is there?','Conte o dinheiro. Quanto tem?'),vis:'<div class="heap">'+items.map(id=>coin(id,CI[id].bill?.9:.9)).join('')+'</div>',opts:mk(tot,wr,$f),ex:B('Start with the biggest and add one by one: '+runningText(items)+'. Total = <b>'+$f(tot)+'</b>.','Comece pelo maior e some um a um: '+runningText(items)+'. Total = <b>'+$f(tot)+'</b>.')})}
function greedy(c){const names={b20:'$20 bill',b10:'$10 bill',b5:'$5 bill',toonie:'toonie',loonie:'loonie',quarter:'quarter',dime:'dime',nickel:'nickel',penny:'penny'};const parts=[];
 ['b20','b10','b5','toonie','loonie','quarter','dime','nickel','penny'].forEach(id=>{const n=Math.floor(c/CI[id].c);if(n){parts.push(n+' '+names[id]+(n>1&&!/bill/.test(names[id])?'s':''));c-=n*CI[id].c}});return parts.join(' + ')}
function gBuild(){const t=rnd(0,8)*100+pick([0,5,10,15,25,30,35,40,45,50,60,75,85,90,95]);const tt=t<=0?135:t;
 return {type:'build',label:'Montar '+$f(tt),target:tt,pal:['b10','b5','toonie','loonie','quarter','dime','nickel','penny'],q:B('Drag coins and bills to the tray to make <b>'+$f(tt)+'</b>.','Arraste moedas e notas para a bandeja e forme <b>'+$f(tt)+'</b>.'),showTarget:true,ex:B('One way to make '+$f(tt)+': <b>'+greedy(tt)+'</b>. There are many ways!','Um jeito de formar '+$f(tt)+': <b>'+greedy(tt)+'</b>. Existem muitas formas!')}}
function gEquiv(){const L=[
 [B('Which group is worth the same as <b>1 quarter</b> (25¢)?','Qual grupo vale o mesmo que <b>1 quarter</b> (25¢)?'),'2 dimes + 1 nickel',['2 dimes','1 dime + 1 nickel','3 nickels + 1 penny'],'2 dimes = 20¢, plus 1 nickel = 5¢. Total 25¢.'],
 [B('Which group is worth the same as <b>1 loonie</b> ($1)?','Qual grupo vale o mesmo que <b>1 loonie</b> ($1)?'),'4 quarters',['3 quarters','8 dimes','9 nickels'],'4 quarters = 4 × 25¢ = 100¢ = $1.'],
 [B('Which group is worth the same as <b>1 toonie</b> ($2)?','Qual grupo vale o mesmo que <b>1 toonie</b> ($2)?'),'2 loonies',['1 loonie + 1 quarter','7 quarters','15 dimes'],'2 loonies = $1 + $1 = $2.'],
 [B('Which group is worth the same as <b>1 dime</b> (10¢)?','Qual grupo vale o mesmo que <b>1 dime</b> (10¢)?'),'2 nickels',['3 nickels','1 nickel','5 pennies'],'2 nickels = 5¢ + 5¢ = 10¢.']];
 const x=pick(L);return choiceEx({label:'Grupos de moedas com o mesmo valor',q:x[0],opts:[opt(x[1],1)].concat(x[2].map(o=>opt(o))),ex:B(x[3],x[3])})}
const ITEMS=[B('funky socks','meias coloridas'),B('sticker pack','pacote de adesivos'),B('notebook','caderno'),B('juice box','suquinho'),B('eraser','borracha'),B('hair clips','presilhas'),B('popcorn','pipoca'),B('bracelet','pulseira'),B('pencil case','estojo'),B('lemonade','limonada')];
function countUp(p,q){const st=[];let cur=p;const d=(10-cur%10)%10;if(d){st.push([d,cur+d]);cur+=d}const d2=(100-cur%100)%100;if(d2){st.push([d2,cur+d2]);cur+=d2}if(q>cur)st.push([q-cur,q]);return st}
function scene(){const item=pick(ITEMS);const price=rnd(1,8)*100+pick([15,25,35,45,49,55,65,75,85,89,95,99]);const paid=[500,1000,2000].find(b=>b>price);return {item,price,paid,ch:paid-price}}
function changeEx(s){const st=countUp(s.price,s.paid);const steps=$f(s.price)+st.map(x=>' → +'+vt(x[0])+' → '+$f(x[1])).join('');
 return B('Count up from the price: '+steps+'. Change = '+st.map(x=>vt(x[0])).join(' + ')+' = <b>'+$f(s.ch)+'</b>. Also: '+$f(s.paid)+' − '+$f(s.price)+' = '+$f(s.ch)+'.','Conte a partir do preço: '+steps+'. Troco = '+st.map(x=>vt(x[0])).join(' + ')+' = <b>'+$f(s.ch)+'</b>. Ou: '+$f(s.paid)+' − '+$f(s.price)+' = '+$f(s.ch)+'.')}
const sceneVis=s=>'<span class="price">'+$f(s.price)+' <span>'+T(s.item,LANG)+'</span></span><div class="bigcoin">'+coin(s.paid===500?'b5':s.paid===1000?'b10':'b20',1.2)+'</div>';
function gChangeBuild(){const s=scene();return {type:'build',label:'Troco de '+$f(s.price)+' pagando '+$f(s.paid),target:s.ch,pal:['b10','b5','toonie','loonie','quarter','dime','nickel','penny'],showTarget:false,visFn:()=>sceneVis(s),q:B('The <b>'+s.item.en+'</b> costs <b>'+$f(s.price)+'</b>. You pay with a <b>'+$f(s.paid)+'</b> bill. Build the change.','O item <b>'+s.item.pt+'</b> custa <b>'+$f(s.price)+'</b>. Você paga com uma nota de <b>'+$f(s.paid)+'</b>. Monte o troco.'),ex:changeEx(s)}}
function gChangeChoice(){const s=scene();const wr=shuffle([s.ch+10,s.ch-10,s.ch+100,s.ch-100,s.price,s.ch+1]).filter(x=>x>0);
 return choiceEx({label:'Troco: '+$f(s.paid)+' − '+$f(s.price),q:B('The <b>'+s.item.en+'</b> costs <b>'+$f(s.price)+'</b>. You pay with a <b>'+$f(s.paid)+'</b> bill. How much change do you get?','O item <b>'+s.item.pt+'</b> custa <b>'+$f(s.price)+'</b>. Você paga com uma nota de <b>'+$f(s.paid)+'</b>. Quanto vem de troco?'),vis:sceneVis(s),opts:mk(s.ch,wr,$f),ex:changeEx(s)})}
function calcEx(){const add=Math.random()<.5;let a=rnd(110,690),b=rnd(105,590);a=a-a%5+(rnd(0,1)?4:0);b=b-b%5+(rnd(0,1)?9:0);if(!add&&b>a){const t=a;a=b;b=t}if(a===b)a+=25;const r=add?a+b:a-b;
 const lines=(add?'  ':'  ')+$f(a).padStart(7)+'\n'+(add?'+ ':'− ')+$f(b).padStart(7)+'\n  ───────\n  '+$f(r).padStart(7);
 const wr=shuffle([r+10,r-10,r+100,r-100,r+1,r-1,r+5]).filter(x=>x>0);
 return choiceEx({label:$f(a)+(add?' + ':' − ')+$f(b),q:B('Solve: <b>'+$f(a)+(add?' + ':' − ')+$f(b)+'</b>','Resolva: <b>'+$f(a)+(add?' + ':' − ')+$f(b)+'</b>'),opts:mk(r,wr,$f),ex:B('Line up the decimal points, then '+(add?'add':'subtract')+' cents first, then dollars:<br><span class="mono">'+lines+'</span>','Alinhe os pontos decimais e '+(add?'some':'subtraia')+' primeiro os centavos, depois os dólares:<br><span class="mono">'+lines+'</span>')})}
function gEqual(){const E=sample(SHP.E,3),U=sample(SHP.U,3);
 return {type:'multi',shape:true,label:'Formas divididas em duas partes iguais',q:B('Tap the shapes divided into <b>two equal parts</b>. Then check.','Toque nas formas divididas em <b>duas partes iguais</b>. Depois confira.'),tokens:shuffle(E.map(f=>({h:shapeSvg(f),ok:true})).concat(U.map(f=>({h:shapeSvg(f),ok:false})))),ex:B('Equal parts are exactly the <b>same size</b>. A line that cuts the shape in the middle makes 2 equal halves; a line off to one side makes a big part and a small part.','Partes iguais têm <b>exatamente o mesmo tamanho</b>. Uma linha no meio faz 2 metades iguais; uma linha mais para um lado faz uma parte grande e uma pequena.')}}
function fracPick(n,d){const wr=shuffle([[d-n,d],[n,d+1],[1,d],[n+1,d],[n,d-1],[d,n]]).filter(x=>x[0]>0&&x[1]>0&&!(x[0]===n&&x[1]===d));const seen=new Set([n+'/'+d]);const out=[{h:fr(n,d),ok:true}];
 for(const w of wr){const k=w[0]+'/'+w[1];if(seen.has(k))continue;seen.add(k);out.push({h:fr(w[0],w[1]),ok:false});if(out.length>=4)break}return out}
function gFracName(){const d=pick([2,3,4,6,8]);const k=rnd(1,d-1);const use=Math.random()<.6?'pie':'bar';const on=[];for(let i=0;i<k;i++)on.push(i);
 return choiceEx({label:'Que fração está pintada: '+k+'/'+d,q:B('What fraction is shaded?','Que fração está pintada?'),vis:use==='pie'?pie(d,on,{size:130}):bar(d,on,{w:260}),opts:fracPick(k,d),ex:B('The whole has <b>'+d+'</b> equal parts (denominator). <b>'+k+'</b> are shaded (numerator). So '+fr(k,d)+'.','O todo tem <b>'+d+'</b> partes iguais (denominador). <b>'+k+'</b> estão pintadas (numerador). Então '+fr(k,d)+'.')})}
function gPaint(){const d=pick([2,3,4,6,8]);const k=rnd(1,d-1);const kind=Math.random()<.6?'pie':'bar';
 return {type:'paint',kind,d,k,label:'Pintar '+k+'/'+d,q:B('Color the equal parts to show '+fr(k,d)+'.','Pinte as partes iguais para mostrar '+fr(k,d)+'.'),ex:B('The denominator '+d+' tells us the whole has '+d+' equal parts. The numerator '+k+' tells us to color '+k+' of them.','O denominador '+d+' diz que o todo tem '+d+' partes iguais. O numerador '+k+' diz para pintar '+k+' delas.')}}
function gSetFrac(){const tot=pick([5,6,7,8,10]);const k=rnd(1,tot-1);const on=[];for(let i=0;i<k;i++)on.push(i);
 return choiceEx({label:'Fração do grupo: '+k+'/'+tot,q:B('Write the fraction of the group that is shaded.','Escreva a fração do grupo que está pintada.'),vis:dots(tot,on,{cols:tot>6?5:Math.min(tot,4)}),opts:fracPick(k,tot),ex:B('Count all the circles: <b>'+tot+'</b> (bottom number). Count the shaded ones: <b>'+k+'</b> (top number). So '+fr(k,tot)+'.','Conte todas as bolinhas: <b>'+tot+'</b> (número de baixo). Conte as pintadas: <b>'+k+'</b> (número de cima). Então '+fr(k,tot)+'.')})}
function gSetPaint(){const tot=pick([4,6,8,9,10]);const d=pick([2,3,4].filter(x=>tot%x===0));const k=tot/d;
 return {type:'paint',kind:'set',d:tot,k,label:'Pintar 1/'+d+' de '+tot,q:B('Color '+fr(1,d)+' of the group ('+tot+' circles).','Pinte '+fr(1,d)+' do grupo ('+tot+' bolinhas).'),ex:B('Split '+tot+' into '+d+' equal groups: '+tot+' ÷ '+d+' = <b>'+k+'</b>. Color '+k+' circles.','Divida '+tot+' em '+d+' grupos iguais: '+tot+' ÷ '+d+' = <b>'+k+'</b>. Pinte '+k+' bolinhas.')}}
const OBJ=[B('balls','bolas'),B('stars','estrelas'),B('hearts','corações'),B('ice creams','sorvetes'),B('flowers','flores'),B('cookies','biscoitos')];
function gSetOf(){const d=pick([2,3,4]);const k=rnd(1,d===2?5:d===3?4:3);const tot=d*k;const o=pick(OBJ);const wr=shuffle([k+1,k-1,tot-k,d,k+2,tot,k+3,tot+1,k+4]).filter(x=>x>0);
 return choiceEx({label:'1/'+d+' de '+tot,q:B(fr(1,d)+' of <b>'+tot+'</b> '+o.en+' is…','<b>'+fr(1,d)+'</b> de <b>'+tot+'</b> '+o.pt+' é…'),vis:dots(tot,[],{cols:Math.min(tot,6)}),opts:mk(k,wr,x=>String(x)),ex:B('To find '+fr(1,d)+' of '+tot+', share them into '+d+' equal groups: '+tot+' ÷ '+d+' = <b>'+k+'</b>.','Para achar '+fr(1,d)+' de '+tot+', divida em '+d+' grupos iguais: '+tot+' ÷ '+d+' = <b>'+k+'</b>.')})}
function gFlag(){const f=pick(FL);const ci=pick(f.ask);const nm=f.nm[ci];let x=0;f.nm.forEach((n,i)=>{if(n[0]===nm[0])x+=f.parts[i]});const tot=f.parts.reduce((a,b)=>a+b,0);const g=gcd(x,tot);const n=x/g,d=tot/g;
 const pool=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,6]];const wr=shuffle(pool).filter(p=>!(p[0]===n&&p[1]===d));
 const opts=[{h:fr(n,d),ok:true}].concat(wr.slice(0,3).map(p=>({h:fr(p[0],p[1]),ok:false})));
 const extra=f.id==='ca'?B(' Imagine 4 equal strips: red, white, white, red.',' Imagine 4 faixas iguais: vermelha, branca, branca, vermelha.'):{en:'',pt:''};
 return choiceEx({label:'Bandeira '+f.de+': fração '+nm[1],q:B('What fraction of the flag of '+f.en+' is <b>'+nm[0]+'</b>?','Que fração da bandeira '+f.de+' é <b>'+nm[1]+'</b>?'),vis:flagSvg(f),opts,ex:B('The flag has '+tot+' equal parts. '+x+' of them are '+nm[0]+'. So '+fr(x,tot)+(g>1?' = '+fr(n,d):'')+'.'+extra.en,'A bandeira tem '+tot+' partes iguais. '+x+' delas são '+nm[1]+'. Então '+fr(x,tot)+(g>1?' = '+fr(n,d):'')+'.'+extra.pt)})}
function gImproper(){const d=pick([2,3,4]);const n=rnd(d+1,3*d-1);const wr=[[n+1,d],[n-1,d],[d,n],[n,d+1],[n,d-1]];const seen=new Set([n+'/'+d]);const out=[{h:fr(n,d),ok:true}];
 for(const w of wr){if(w[0]<=0||w[1]<=0)continue;const k=w[0]+'/'+w[1];if(seen.has(k))continue;seen.add(k);out.push({h:fr(w[0],w[1]),ok:false});if(out.length>=4)break}
 return choiceEx({label:'Fração imprópria '+n+'/'+d,q:B('Match the picture to the correct improper fraction.','Associe a figura à fração imprópria correta.'),vis:pies(n,d,{size:92}),opts:out,ex:B('Each circle has '+d+' equal parts. Count all the shaded parts: <b>'+n+'</b>. So '+fr(n,d)+' (numerator bigger than denominator = improper fraction).','Cada círculo tem '+d+' partes iguais. Conte todas as partes pintadas: <b>'+n+'</b>. Então '+fr(n,d)+' (numerador maior que o denominador = fração imprópria).')})}
function gMixed(){const d=pick([2,3,4]);const w=rnd(1,2);const r=rnd(1,d-1);const n=w*d+r;const cands=[[w,r+1<d?r+1:r-1||1,d],[w+1,r,d],[r,w,d],[w,r,d+1],[w+1,r+1<d?r+1:1,d],[w+2,r,d],[w,r,d+2],[w+1,r,d+1]];const seen=new Set([w+' '+r+'/'+d]);const out=[{h:mixed(w,r,d),ok:true}];
 for(const c of cands){const k=c[0]+' '+c[1]+'/'+c[2];if(c[1]>=c[2]||seen.has(k))continue;seen.add(k);out.push({h:mixed(c[0],c[1],c[2]),ok:false});if(out.length>=4)break}
 return choiceEx({label:n+'/'+d+' como número misto',q:B('Write '+fr(n,d)+' as a mixed number.','Escreva '+fr(n,d)+' como número misto.'),vis:pies(n,d,{size:84}),opts:out,ex:B(d+' parts make 1 whole. In '+fr(n,d)+' there are <b>'+w+'</b> whole'+(w>1?'s':'')+' and <b>'+r+'</b> extra part'+(r>1?'s':'')+': '+mixed(w,r,d)+'.',d+' partes formam 1 inteiro. Em '+fr(n,d)+' cabem <b>'+w+'</b> inteiro'+(w>1?'s':'')+' e sobram <b>'+r+'</b> parte'+(r>1?'s':'')+': '+mixed(w,r,d)+'.')})}
function gWhichImproper(){const d=pick([3,4,5]);const n=d+rnd(1,d-1);const props=sample([1,2,3,4].filter(x=>x<d).concat([d-1]),2);const list=[[n,d,true],[props[0],d,false],[props[1]===props[0]?1:props[1],d+1,false],[2,d+2,false]];
 return choiceEx({label:'Qual é imprópria',q:B('Which one is an <b>improper fraction</b>?','Qual destas é uma <b>fração imprópria</b>?'),opts:list.map(x=>opt(fr(x[0],x[1]),x[2])),ex:B('An improper fraction has a numerator greater than or equal to the denominator. '+fr(n,d)+' has '+n+' ≥ '+d+'.','Fração imprópria tem numerador maior ou igual ao denominador. '+fr(n,d)+' tem '+n+' ≥ '+d+'.')})}
function gWhole(){const d=pick([2,3,4,6]);return choiceEx({label:'Fração igual a um inteiro',q:B('Which fraction is exactly <b>one whole</b>?','Qual fração é exatamente <b>um inteiro</b>?'),opts:fracPick(d,d),ex:B('When the numerator equals the denominator, all '+d+' parts are there: '+fr(d,d)+' = 1 whole.','Quando o numerador é igual ao denominador, todas as '+d+' partes estão lá: '+fr(d,d)+' = 1 inteiro.')})}
function gWord(){const k=rnd(0,5);const a=rnd(2,9)*100+pick([25,50,75,0]),b=rnd(1,6)*100+pick([35,45,15,0]);
 const ps=[
  ()=>{const have=rnd(6,15)*100;const cost=rnd(1,5)*100+pick([25,50,75,99]);const r=have-cost;return mkW('Léo tem '+$f(have)+' e compra um caderno de '+$f(cost)+'. Quanto sobra?',r,'Subtração: '+$f(have)+' − '+$f(cost)+' = '+$f(r)+'.')},
  ()=>{const r=a+b;return mkW('Ana comprou um estojo por '+$f(a)+' e uma borracha por '+$f(b)+'. Quanto ela gastou no total?',r,'Adição: '+$f(a)+' + '+$f(b)+' = '+$f(r)+'.')},
  ()=>{const goal=rnd(5,12)*100;const have=goal-rnd(1,4)*100-pick([15,35,60]);const r=goal-have;return mkW('Bia quer uma bolsa de '+$f(goal)+' e já juntou '+$f(have)+'. Quanto falta?',r,'Subtração: '+$f(goal)+' − '+$f(have)+' = '+$f(r)+'.')},
  ()=>{const s=scene();return mkW('Emiliano pagou '+$f(s.price)+' com uma nota de '+$f(s.paid)+'. Quanto recebeu de troco?',s.ch,changeEx(s).pt)},
  ()=>{const q=rnd(3,9);const r=q*25;return mkW('Quanto dinheiro tem em '+q+' quarters (moedas de 25¢)?',r,q+' × 25¢ = '+r+'¢ = '+$f(r)+'.')},
  ()=>{const d=rnd(2,5),n=rnd(1,4);const r=d*10+n*5;return mkW('Quanto valem '+d+' dimes (10¢) e '+n+' nickels (5¢) juntos?',r,d+' × 10¢ = '+d*10+'¢ e '+n+' × 5¢ = '+n*5+'¢. Juntos: '+r+'¢ = '+$f(r)+'.')}
 ];return ps[k]()}
function mkW(q,r,e){const wr=shuffle([r+10,r-10,r+100,r-100,r+25,r-25,r+1]).filter(x=>x>0);return choiceEx({label:q,q:{en:q,pt:q},opts:mk(r,wr,$f),ex:{en:e,pt:e}})}

function stepSort(){return SOP('Caminho da água até a torneira','Coloque cada etapa na <b>ordem certa</b>. Arraste para a etapa 1, 2, 3, 4 ou 5.',[['1','Etapa 1'],['2','Etapa 2'],['3','Etapa 3'],['4','Etapa 4'],['5','Etapa 5']],[['A água é captada em um rio, lago ou reservatório','1'],['Na ETA, a água passa por tratamento e fica potável','2'],['A água é armazenada em reservatórios e vai pelos canos','3'],['A água chega à torneira da sua casa','4'],['Depois do uso, vira esgoto e vai para a ETE','5']],t=>'<b>'+t.t+'</b> é a etapa '+t.b+'.','Ordem: captação → ETA (tratamento) → reservatórios e canos → torneira → esgoto e ETE.')}
function cycleSort(){return SOP('Ciclo da água','Coloque cada etapa do <b>ciclo da água</b> no lugar certo.',[['1','Evaporação','o calor do sol'],['2','Condensação','vapor vira nuvem'],['3','Precipitação','chuva'],['4','Volta aos rios','escoamento']],[['O calor do sol aquece a água do rio e ela vira vapor','1'],['O vapor sobe, esfria e forma nuvens','2'],['A água cai das nuvens em forma de chuva','3'],['A água da chuva escorre e volta aos rios e ao solo','4']],t=>'<b>'+t.t+'</b> → etapa '+({1:'evaporação',2:'condensação',3:'precipitação',4:'volta aos rios'})[t.b]+'.','Ciclo: evaporação, condensação, precipitação e volta ao solo e aos rios.')}

function pollSort(){return SOP('Causa ou consequência','Isso é uma <b>causa</b> da poluição da água ou uma <b>consequência</b>?',[['c','Causa','o que polui'],['e','Consequência','o que acontece depois']],sample(PCZ,6),t=>'<b>'+t.t+'</b> é '+(t.b==='c'?'uma causa da poluição da água.':'uma consequência da poluição da água.'),'Causas: esgoto, indústria, agrotóxicos, lixo, petróleo, desmatamento. Consequências: doenças, morte de seres aquáticos, falta de água boa para beber.')}

 QP('Agrotóxicos','Como os produtos químicos usados nas plantações podem poluir a água?',['Infiltram no solo e contaminam águas subterrâneas; a chuva também os leva aos rios','Ficam presos nas folhas para sempre','Evaporam sem deixar rastro','Servem para limpar a água'],'A chuva pode levar esses produtos para rios e lagos próximos.'),
 QP('Ilha de lixo','A ilha de lixo do oceano Pacífico é formada por…',['garrafas, sacolas, embalagens e redes levadas pelas correntes marinhas','areia e conchas','peixes mortos','navios antigos'],'Ela é cerca de três vezes maior que a França e acumula objetos desde 1977.'),

 QP('Consequência para a natureza','Qual é uma consequência da poluição das águas para a natureza?',['Morte de animais e plantas aquáticos','Mais plantas saudáveis','Rios mais limpos','Mais chuva boa'],'Os seres aquáticos sofrem com a contaminação.')];

const GCONS=[

function binSort(){return SOP('Para onde vai o resíduo?','Para onde cada resíduo deve ir?',[['r','Coleta seletiva','papel, plástico, metal, vidro'],['c','Compostagem','restos orgânicos'],['p','Ponto de coleta','pilhas, baterias, eletrônicos'],['a','Peça ajuda a um adulto','cortantes']],sample([['Jornal velho','r'],['Garrafa PET vazia','r'],['Lata de refrigerante','r'],['Pote de vidro inteiro e limpo','r'],['Casca de banana','c'],['Restos de verdura','c'],['Pilha usada','p'],['Bateria','p'],['Celular velho','p'],['Vidro quebrado','a']],7),t=>'<b>'+t.t+'</b>: '+({r:'vai para a coleta seletiva e pode virar um novo produto (sem restos de comida).',c:'resíduo orgânico, vira adubo na compostagem.',p:'precisa ser entregue em pontos de coleta específicos.',a:'material cortante: peça ajuda de um adulto.'})[t.b],'Papéis, plásticos, metais e vidros → coleta seletiva. Orgânicos → compostagem. Pilhas, baterias e eletrônicos → ponto de coleta. Cortantes → adulto.')}

const LC=(en,pt)=>B('<div class="card">'+en+'</div>','<div class="card">'+pt+'</div>');
const QM=[
 {id:'e1',lang:'en',guide:'mira',mins:7,title:B('Nouns and adjectives','Substantivos e adjetivos'),lesson:LC('<p>A <b>noun</b> names a person, place, animal or thing: teacher, school, butterfly, book.</p><p>An <b>adjective</b> describes a noun. It tells us what someone or something is like: <b>beautiful</b> flower, <b>happy</b> child, <b>tall</b> tree.</p>','<p>Um <b>noun</b> (substantivo) dá nome a pessoa, lugar, animal ou coisa. Um <b>adjective</b> (adjetivo) descreve o substantivo: como ele é.</p>'),build:()=>sample(NA,4).map(naEx).concat(sample(AJE,2).map(a=>ajEx(a,'adj')),sample(AJE,2).map(a=>ajEx(a,'noun')),sample(FA,3).map(faEx),[sortNAV()],DEFN.slice(0,2))},
 {id:'e2',lang:'en',guide:'kai',mins:7,title:B('Verbs','Verbos'),lesson:LC('<p>A <b>verb</b> tells us what someone or something does. It can also tell us about a state or condition.</p><p>Examples: run, jump, swim, read, <b>is</b>, <b>are</b>.</p>','<p>Um <b>verb</b> (verbo) diz o que alguém ou algo faz. Também pode mostrar um estado: is, am, are.</p>'),build:()=>VF.map(vfEx).concat(sample(VT,3).map(vtEx),[sortNAV()],sample(DEFN.slice(2),3))},
 {id:'e3',lang:'en',guide:'zuri',mins:8,title:B('Story elements','Elementos da história'),lesson:LC('<ul><li><b>Main character</b>: who the story is mostly about.</li><li><b>Setting</b>: where and when it happens.</li><li><b>Problem</b>: the challenge the character faces.</li><li><b>Solution</b>: how the problem is solved.</li><li><b>Plot</b>: the events in the beginning, middle and end.</li></ul>','<ul><li><b>Main character</b>: personagem principal.</li><li><b>Setting</b>: lugar e tempo.</li><li><b>Problem</b>: problema.</li><li><b>Solution</b>: solução.</li><li><b>Plot</b>: enredo: começo, meio e fim.</li></ul>'),build:()=>[defEx(),defEx(),defEx()].concat(sample(STORIES,2).reduce((a,f)=>a.concat(f()),[]),[plotSort()])},
 {id:'e4',lang:'en',guide:'juno',mins:6,title:B('Books by Kevin Henkes: Chrysanthemum','Livros de Kevin Henkes: Chrysanthemum'),lesson:LC('<p><b>Chrysanthemum</b> is a story by <b>Kevin Henkes</b>. Chrysanthemum is a little mouse who loves her name. At school, the other kids laugh at it, and she feels sad. Then the music teacher, Mrs. Twinkle, says she loves the name. At the end, Chrysanthemum feels proud again.</p><p>Stories can teach lessons about friendship, kindness, feelings and accepting ourselves and others.</p>','<p><b>Chrysanthemum</b> é uma história de <b>Kevin Henkes</b>. Chrysanthemum é uma ratinha que ama seu nome. Na escola, os colegas riem do nome e ela fica triste. Depois a professora de música, Mrs. Twinkle, diz que adora o nome. No final, ela volta a se sentir orgulhosa.</p>'),build:()=>shuffle(CHR)},
 {id:'e5',lang:'en',guide:'sol',mins:7,title:B('Nature and Mother Earth','Natureza e Mãe Terra'),lesson:LC('<p>Nature provides what living things need: <b>water, air, food</b> and places to live.</p><p>We can protect our planet by <b>reducing waste, recycling, saving water</b> and caring for plants and animals.</p>','<p>A natureza dá o que os seres vivos precisam: água, ar, comida e lugares para viver. Podemos protegê-la reduzindo o lixo, reciclando, economizando água e cuidando de plantas e animais.</p>'),build:()=>shuffle(ME).slice(0,7).concat([earthSort(),earthSort()])},
 {id:'h1',lang:'pt',guide:'zuri',mins:8,title:'História: espaços públicos e privados',lesson:'<div class="card"><p><b>Espaços privados</b> pertencem a uma pessoa ou a uma empresa. A moradia é privada e se chama <b>espaço doméstico</b>, pois protege a família.</p><p><b>Espaços públicos</b> pertencem à população e são administrados pelos governantes. Exemplos: escola municipal, praça, o Parque Nacional da Chapada dos Veadeiros (uma <b>unidade de conservação</b>, que preserva áreas naturais).</p><p>A circulação pode ser <b>livre</b> ou <b>restrita</b> (com regras sobre quem pode entrar).</p></div>',build:()=>[pubSort(),pubSort()].concat(sample(HP,8))},
 {id:'h2',lang:'pt',guide:'kai',mins:8,title:'História: trabalho e lazer, antes e agora',lesson:'<div class="card"><p><b>Trabalho</b> é uma atividade para transformar algo e garantir o sustento. <b>Lazer</b> é o que fazemos no tempo livre por prazer.</p><p><b>Passado:</b> trabalho manual, fábricas, máquinas de escrever; lazer em brincadeiras de rua, jogos de tabuleiro, cinema de rua e bailes.</p><p><b>Presente:</b> trabalho digital, híbrido e home office; lazer com streaming, jogos virtuais e redes sociais.</p><p>Nem todas as pessoas têm as mesmas oportunidades de trabalho e de lazer.</p></div>',build:()=>[tlSort(),ppSort(),tlSort()].concat(sample(HT,7))},
 {id:'h3',lang:'pt',guide:'mira',mins:6,title:'História: a cidade ao longo do tempo',lesson:'<div class="card"><p>Para conhecer a história de uma cidade, observe <b>construções, praças, monumentos, ruas e pessoas</b>. Os nomes de praças e ruas também contam o passado. Assim percebemos como a cidade se transformou.</p></div>',build:()=>[cityMulti()].concat(shuffle(HC),[ppSort(),pubSort()])}
];
const SM=[
 {id:'s1',lang:'en',guide:'juno',mins:8,title:B('Forces: pushes and pulls','Forças: empurrar e puxar'),lesson:LC('<p>A <b>force</b> is a push or a pull that can change how an object moves. A force can make an object <b>start moving, stop moving, change direction</b> or <b>change speed</b>.</p><p><b>Contact force</b>: objects touch (pushing a chair, kicking a ball, friction). <b>Non-contact force</b>: acts without touching (gravity, magnetism, static electricity).</p>','<p>Força é um empurrão ou uma puxada que pode mudar o movimento de um objeto. Força de contato: os objetos se tocam. Força sem contato: age sem tocar.</p>'),build:()=>sample(PUPU,4).map(pupuEx).concat(sample(FX,3).map(fxEx),[cnSort(),cnSort()],shuffle(FD))},
 {id:'s2',lang:'en',guide:'sol',mins:7,title:B('Gravity and astronauts','Gravidade e astronautas'),lesson:LC('<p><b>Gravity</b> is a force that pulls objects toward one another. On Earth it pulls objects toward the ground.</p><p>Astronauts float in the ISS because they and the station are <b>falling around Earth together</b>. Gravity does <b>not</b> disappear in space!</p>','<p>A gravidade puxa os objetos uns para os outros. Os astronautas flutuam porque eles e a estação "caem" em volta da Terra juntos. A gravidade não some no espaço.</p>'),build:()=>shuffle(GR)},
 {id:'s3',lang:'en',guide:'zuri',mins:7,title:B('Types of forces','Tipos de forças'),lesson:LC('<ul><li><b>Gravity</b>: pulls objects toward one another (an apple falls).</li><li><b>Magnetism</b>: attracts magnetic materials or repels another magnet.</li><li><b>Static electricity</b>: electric charges build up on a surface (a charged balloon attracts paper).</li><li><b>Friction</b>: resists movement when two surfaces touch (bike brakes).</li></ul>','<ul><li>Gravidade: puxa os objetos.</li><li>Magnetismo: atrai ou repele ímãs.</li><li>Eletricidade estática: cargas se acumulam (balão e papel).</li><li>Atrito: resiste ao movimento (freio da bicicleta).</li></ul>'),build:()=>sample(TFS,8).map(tfEx).concat([cnSort()])},
 {id:'s4',lang:'en',guide:'kai',mins:7,title:B('Static electricity and lightning safety','Eletricidade estática e segurança em tempestades'),lesson:LC('<p>Static electricity is a buildup of electric charges. It can cause a spark or a small shock. It can be dangerous near flammable things and can damage electronics.</p><p>In a lightning storm: go inside a <b>strong building</b> or an <b>enclosed car</b>, stay away from <b>open fields, tall isolated trees and water</b>, avoid outdoor equipment, and wait until the storm has passed.</p>','<p>Eletricidade estática é o acúmulo de cargas elétricas. Em tempestade com raios: vá para um prédio firme ou carro fechado, fique longe de campos abertos, árvores altas isoladas e água, e espere a tempestade passar.</p>'),build:()=>shuffle(SE).concat([lightSort(),lightSort()])},
 {id:'s5',lang:'en',guide:'mira',mins:9,title:B('Magnets and their poles','Ímãs e seus polos'),lesson:LC('<p>Every magnet has two poles: <b>North (N)</b> and <b>South (S)</b>.</p><p><b>Opposite poles attract</b> (N and S). <b>Like poles repel</b> (N and N, or S and S). If you cut a magnet in half, each piece has both poles.</p><p>Magnets attract <b>iron and steel</b>. Not every metal is magnetic, and plastic, rubber, wood and paper are not attracted.</p>','<p>Todo ímã tem polo norte e polo sul. Polos opostos se atraem; polos iguais se repelem. Cortando um ímã, cada pedaço tem os dois polos. Ímãs atraem ferro e aço.</p>'),build:()=>[magLab(),magLab(),magLab()].concat(shuffle(MG).slice(0,5),[magSort(),magSort()])},
 {id:'g1',lang:'pt',guide:'sol',mins:6,title:'Geografia: o uso da água',lesson:'<div class="card"><p>Usamos água para <b>beber, cozinhar, tomar banho</b>, regar plantas, pescar e até <b>gerar energia elétrica</b>. Sem água, nosso corpo não funcionaria de forma saudável.</p></div>',build:()=>shuffle(GU).concat([wuSort(),wuSort()])},
 {id:'g2',lang:'pt',guide:'zuri',mins:8,title:'Geografia: da torneira ao ciclo da água',lesson:'<div class="card"><p><b>Caminho da água:</b> captação → <b>ETA</b> (tratamento) → reservatórios e canos → torneira → esgoto → <b>ETE</b>.</p><p><b>Ciclo da água:</b> o sol faz a água <b>evaporar</b>, o vapor esfria e forma nuvens (<b>condensação</b>), cai como chuva (<b>precipitação</b>) e volta ao solo e aos rios.</p></div>',build:()=>[stepSort(),cycleSort()].concat(shuffle(GC))},
 {id:'g3',lang:'pt',guide:'kai',mins:7,title:'Geografia: poluição das águas',lesson:'<div class="card"><p>Causas: esgoto sem tratamento, resíduos da indústria, agrotóxicos, lixo nos rios e mares, petróleo, desmatamento e mercúrio. Consequências: doenças, morte de animais e plantas aquáticos e água ruim para beber.</p></div>',build:()=>[pollSort(),pollSort()].concat(shuffle(GP))},
 {id:'g4',lang:'pt',guide:'juno',mins:9,title:'Geografia: consumo e descarte de resíduos',lesson:'<div class="card"><p>Consumimos alimentos e água todos os dias. Comprar sem precisar é <b>consumismo</b>.</p><p>Papéis, plásticos, metais e vidros vão para a <b>coleta seletiva</b>. Restos orgânicos viram adubo na <b>compostagem</b>. Pilhas, baterias e eletrônicos vão para <b>pontos de coleta</b>. Materiais cortantes pedem ajuda de um adulto.</p></div>',build:()=>[necSort(),binSort(),binSort()].concat(shuffle(GCONS),sample(GR2,5))}
];

 let i=0;const a=ac();
 const step=()=>{i++;if(a){tone(i%2?70:90,0,.18,'sine',.3);tone([523,659,784,659][i%4],0,.2,'square',.05);if(i%2===0)tone(2200,0,.03,'square',.03)}};
 beat=setInterval(step,300);
 const tm=setInterval(()=>{left--;const el=$('#dt');if(el)el.textContent=left;if(left<=0)stop()},1000);
 function stop(){clearInterval(beat);clearInterval(tm);ov.innerHTML=''}
 $('#dskip').onclick=stop}

/* ---------- início de missão ---------- */
function startMission(d,m){RUN_DAY=d;LANG=m.lang||d.lang||'pt';document.body.classList.toggle('alt-on',LANG==='en'&&!!S.alt);
 if(m.lesson&&!m.boss){const l=m.lesson;
  MAIN.innerHTML='<section class="lesson"><div class="row"><button class="ghost sm" id="quit">Sair</button>'+(LANG==='en'?'<button class="ghost sm" id="altb">Ver em português</button>':'')+'</div><div class="guide">'+avatar(m.guide,56)+'<div><div class="kick">'+MEM[m.guide].n+' · '+MEM[m.guide].r+'</div><h2>'+mtitle(m,LANG)+'</h2></div></div>'+(typeof l==='string'?l:(LANG==='en'?l.en+'<div class="alt">'+l.pt+'</div>':l.pt))+'<div><button class="btn" id="go">Entendi, bora!</button> <span class="lead"> · cerca de '+m.mins+' min</span></div></section>';
  $('#quit').onclick=()=>{location.hash='#'+d.id;route()};
  const ab=$('#altb');if(ab){ab.textContent=S.alt?'Esconder português':'Ver em português';ab.onclick=()=>{S.alt=!S.alt;save();document.body.classList.toggle('alt-on',S.alt);ab.textContent=S.alt?'Esconder português':'Ver em português'}}
  $('#go').onclick=()=>begin();window.scrollTo(0,0)}
 else begin();
 function begin(){const q=m.build();RUN={m,queue:q.slice(),idx:0,res:[],start:Date.now()};showEx()}}

/* =======================================================
   TELAS
======================================================= */
function renderSide(){const rec=recDay(),cur=location.hash.slice(1);
 $('#me').innerHTML='<div><b>Olívia</b><div class="dp">'+Object.keys(S.stars).filter(k=>S.stars[k]>0).length+' missões feitas</div></div>'+stars(Math.min(3,Math.round(Object.values(S.stars).reduce((a,b)=>a+b,0)/Math.max(1,Object.keys(S.stars).length))||0));
 $('#days').innerHTML=DAYS.map(d=>'<a class="day'+(cur===d.id?' on':'')+'" href="#'+d.id+'"><div class="dt">'+d.dow.slice(0,3).toUpperCase()+'<small>'+d.date+'</small></div><div><div class="dn">'+d.name+(d.id===rec.id?'<span class="tag rec">próxima</span>':'')+(d.soon?'<span class="tag soon">em breve</span>':'')+'</div><div class="dp">'+(d.soon?'chega nas próximas rodadas':'missões '+dayDone(d))+'</div></div></a>').join('');
 $('#l-album').classList.toggle('on',cur==='album');$('#l-pais').classList.toggle('on',cur==='pais');
 $('#snd').textContent=S.sound?'Ligado':'Desligado';$('#snd').setAttribute('aria-pressed',S.sound)}
function home(){const rec=recDay(),n=daysTo(rec);
 MAIN.innerHTML='<section class="hero"><div class="kick">Lumina Study Stage</div><h1>Oi, Olívia! O palco é seu.</h1><p class="lead">Uma missão por vez, de 6 a 8 minutos. Erros voltam no final para você fixar, e cada missão vale um photocard do grupo.</p></section>'
 +'<div class="card" style="max-width:720px"><div class="kick">Próxima prova</div><h2>'+rec.dow+' '+rec.date+': '+rec.name+'</h2><p class="lead">'+(n>0?'Faltam '+n+' dia'+(n>1?'s':''):'É hoje')+'. '+(rec.soon?'Este dia chega nas próximas rodadas.':'Comece pela primeira missão.')+'</p><a class="btn" href="#'+rec.id+'">'+(rec.soon?'Ver o que vai cair':'Entrar no palco')+'</a></div>'
 +'<h2 style="margin:28px 0 12px">Conheça o grupo</h2><div class="pgrid">'+Object.keys(MEM).map(k=>'<div class="pc" style="--c:'+MEM[k].c+'"><div class="pcav">'+avatar(k,76)+'</div><b>'+MEM[k].n+'</b><small>'+MEM[k].r+'</small></div>').join('')+'</div><p class="lead" style="margin-top:14px">Grupo inventado só para este site. Eles guiam as missões e torcem por você.</p>'}
function dayView(d){
 if(d.soon){MAIN.innerHTML='<section class="hero"><div class="kick">'+d.dow+' · '+d.date+'</div><h1>'+d.name+'</h1><p class="lead">Este dia ainda está sendo preparado e chega no mesmo link nas próximas rodadas. Enquanto isso, treine os dias que já estão abertos.</p></section><div class="card" style="max-width:720px"><h3>O que vai cair</h3><ul>'+d.topics.map(t=>'<li>'+t+'</li>').join('')+'</ul></div>';return}
 const ms=missionsOf(d),l=d.lang;
 MAIN.innerHTML='<section class="hero"><div class="kick">'+d.dow+' · '+d.date+' · prova '+(d.id==='seg'?'(oficina)':'')+'</div><h1>'+d.name+'</h1><p class="lead">'+(l==='en'?'Exercises in English with a button to see Portuguese. Do one mission at a time.':'Faça uma missão por vez. No final, o Chefão mistura tudo.')+'</p><div class="chips">'+d.topics.map(t=>'<span class="chp">'+t+'</span>').join('')+'</div></section>'
 +'<div class="mgrid">'+ms.map((m,i)=>{const s=S.stars[mid(d,m)]||0,ml=m.lang||l;return '<button class="mc'+(m.boss?' boss':'')+'" data-m="'+m.id+'">'+avatar(m.guide,46)+'<h3>'+(m.boss?'Chefão do dia':mtitle(m,ml))+'</h3>'+(ml==='en'&&!m.boss?'<div class="alt">'+T(m.title,'pt')+'</div>':'')+'<div class="meta">'+MEM[m.guide].n+' · ~'+m.mins+' min'+(m.boss?' · 10 questões misturadas':'')+'</div>'+(s?stars(s):'<span class="meta">ainda não feita</span>')+'</button>'}).join('')+'</div>';
 document.body.classList.toggle('alt-on',l==='en'&&!!S.alt);
 $$('.mc').forEach(b=>b.onclick=()=>startMission(d,ms.find(m=>m.id===b.dataset.m)))}
function albumView(){let h='<section class="hero"><div class="kick">Coleção</div><h1>Álbum de photocards</h1><p class="lead">Cada missão concluída libera um card. Com 3 estrelas, ele ganha borda holográfica.</p></section>';
 DAYS.filter(d=>!d.soon).forEach(d=>{h+='<h2 style="margin:22px 0 12px">'+d.dow+' · '+d.name+'</h2><div class="pgrid">'+missionsOf(d).map(m=>{const st=S.stars[mid(d,m)]||0,mem=MEM[m.guide];return '<div class="pc'+(st?'':' lock')+(st===3?' holo':'')+'" style="--c:'+mem.c+'"><div class="pcav">'+(st?avatar(m.guide,80):'?')+'</div><b>'+(st?mem.n:'???')+'</b><small>'+(st?(m.boss?'Chefão':mtitle(m,'pt')):'conclua a missão')+'</small>'+(st?stars(st):'')+'</div>'}).join('')+'</div>'});
 MAIN.innerHTML=h}
let resetArm=false,unsubP=null,REMOTE=null,PSTATE='';
function mergeLog(){const m={};(REMOTE||[]).forEach(e=>{m[e.t]=e});S.log.forEach(e=>{if(!m[e.t])m[e.t]=e});return Object.values(m).sort((a,b)=>b.t-a.t)}
const PNOTE={on:'Sincronizado: os resultados chegam aqui sozinhos assim que a Olívia termina cada missão.',off:'A sincronização não está disponível neste acesso. Mostrando só os resultados salvos neste navegador.',wait:'Buscando os resultados…',slow:'Ainda não consegui alcançar a base. Mostrando o que está salvo neste navegador.',err:'Não consegui alcançar a base agora. Mostrando o que está salvo neste navegador.','':''};
function drawParents(){const body=$('#pbody');if(!body)return;const L=mergeLog();const tot=L.reduce((a,e)=>a+e.n,0),okk=L.reduce((a,e)=>a+e.ok,0),mins=L.reduce((a,e)=>a+e.min,0);
 body.innerHTML='<p class="lead" id="pnote">'+(PNOTE[PSTATE]||'')+'</p><div class="row" style="margin:14px 0 18px"><div class="card"><div class="dp">Missões feitas</div><div class="big">'+L.length+'</div></div><div class="card"><div class="dp">Acerto de primeira</div><div class="big">'+(tot?Math.round(okk/tot*100):0)+'%</div></div><div class="card"><div class="dp">Tempo estudado</div><div class="big">'+mins+' min</div></div></div>'
 +(L.length?'<div class="act" style="margin:0 0 12px"><button class="btn cy" id="cpall">Copiar todos os relatórios</button><button class="ghost" id="rst">Apagar progresso</button></div><textarea class="rep" id="allrep" readonly style="display:none"></textarea>'+L.map(e=>{const dt=new Date(e.t);return '<details><summary>'+dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+' · '+e.title+' · '+e.ok+'/'+e.n+' · '+e.st+' estrela'+(e.st>1?'s':'')+'</summary>'+(e.wrong&&e.wrong.length?'<p>Para revisar:</p><ul>'+e.wrong.map(w=>'<li>'+String(w).replace(/</g,'&lt;')+'</li>').join('')+'</ul>':'<p>Sem erros.</p>')+'</details>'}).join(''):'<p class="lead">Ainda não há missões concluídas.</p>');
 const cp=$('#cpall');if(cp){const ta=$('#allrep');ta.value=L.map(reportText).join('\n\n———\n\n');ta.style.display='block';cp.onclick=()=>copyText(ta.value,cp,ta);
  const r=$('#rst');r.onclick=async()=>{if(!resetArm){resetArm=true;r.textContent='Tem certeza? Toque de novo';return}resetArm=false;const old=(REMOTE||[]).slice();S.stars={};S.log=[];REMOTE=[];save();renderSide();drawParents();
   const db=await getDb();if(db){for(const e of old){try{await db.doc('reports/r'+e.t).delete()}catch(x){break}}}}}}
function parentsView(){
 MAIN.innerHTML='<section class="hero"><div class="kick">Área dos pais</div><h1>Como a Olívia está indo</h1><p class="lead">Cada missão concluída envia o resultado para cá automaticamente, sem ela precisar fazer nada.</p></section><div id="pbody"></div>';
 PSTATE='';drawParents();
 getDb().then(db=>{if(location.hash!=='#pais')return;if(!db){PSTATE='off';drawParents();return}
  PSTATE='wait';drawParents();const timer=setTimeout(()=>{if(PSTATE==='wait'){PSTATE='slow';drawParents()}},10000);
  unsubP=db.collection('reports').orderBy('t','desc').limit(300).onSnapshot(snap=>{clearTimeout(timer);REMOTE=snap.docs.map(d=>d.data());PSTATE='on';drawParents()},()=>{clearTimeout(timer);PSTATE='err';drawParents()})})}

function route(){const h=location.hash.slice(1);RUN=null;if(unsubP){unsubP();unsubP=null}closeDrawer();$('#over').innerHTML='';if(beat)clearInterval(beat);
 const d=DAYS.find(x=>x.id===h);if(d){LANG=d.lang||'pt';document.body.classList.toggle('alt-on',LANG==='en'&&!!S.alt)}else{LANG='pt';document.body.classList.remove('alt-on')}
 if(d)dayView(d);else if(h==='album')albumView();else if(h==='pais')parentsView();else home();
 renderSide();window.scrollTo(0,0)}
function closeDrawer(){$('#side').classList.remove('open')}
$('#menu').onclick=()=>$('#side').classList.toggle('open');
$('#snd').onclick=()=>{S.sound=!S.sound;save();renderSide()};
window.addEventListener('hashchange',route);
route();
flush();
})();
</script>

</body></html>
